:root{

  --ok:#7fd3a6; --ok-bg:#1d332a; --est:#f2c46d; --est-bg:#352d1b; --hero1:#25324a; --hero2:#2a2a3c;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f5f7; --surface:#ffffff; --line:#e3e8ed; --track:#e7ecf1; --fg:#17202a; --muted:#5f6d7b;
  --accent:#2f67d8; --kcal:#e08a2c; --prot:#d9536b; --carb:#4e9e3a; --fat:#8a5bd1; --water:#1f9fd1;
  --ok:#1f8a55; --ok-bg:#e1f4ea; --est:#9a6a00; --est-bg:#fbf0d4; --hero1:#e3ecfd; --hero2:#ece8f7; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f5f7; --surface:#ffffff; --line:#e3e8ed; --track:#e7ecf1; --fg:#17202a; --muted:#5f6d7b;
  --accent:#2f67d8; --kcal:#e08a2c; --prot:#d9536b; --carb:#4e9e3a; --fat:#8a5bd1; --water:#1f9fd1;
  --ok:#1f8a55; --ok-bg:#e1f4ea; --est:#9a6a00; --est-bg:#fbf0d4; --hero1:#e3ecfd; --hero2:#ece8f7; color-scheme:light}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.font-display{font-family:var(--f-display);letter-spacing:-.01em}
h1,h2{text-wrap:balance}
.sticky-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px}
.lbl{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.campo{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 13px;color:var(--fg);font:inherit}
.campo:focus{outline:2px solid var(--accent);outline-offset:1px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;background:transparent;color:var(--fg)}
.chip-sm{padding:4px 9px;font-size:12px}
.chip-on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn-main{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--bg)}
.btn-main:disabled{opacity:.4}
.btn-sec{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn-icon-sm{width:30px;height:30px;border-radius:10px;color:var(--muted)}
.btn-icon:disabled{opacity:.35}
.btn-agua{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;background:var(--water);color:var(--bg);transition:transform .15s}
.btn-agua:active{transform:scale(.94)}
.btn-hero{display:flex;align-items:center;gap:12px;text-align:left;border-radius:22px;padding:18px 16px;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;background:var(--hero1);color:var(--fg);border:1px solid var(--line)}
.btn-hero small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.btn-hero svg{color:var(--accent);flex-shrink:0}
.btn-hero-alt{background:var(--hero2)}
button{cursor:pointer}
.registro:hover{background:var(--bg)}
.dia-btn{padding:0 6px;font-size:20px;line-height:1;color:var(--fg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hoja{animation:sube .28s cubic-bezier(.2,.9,.3,1)}
@keyframes sube{from{transform:translateY(40px);opacity:.4}}
.ola{animation:ola 3.2s linear infinite}
@keyframes ola{to{transform:translateX(80px)}}
@media (prefers-reduced-motion: reduce){.ola,.hoja{animation:none}*{transition:none!important}}
#cargando{padding:40px 0;text-align:center;color:var(--muted)}
</style>

<script>/* Buscador de alimentos: tolera tildes, mayúsculas y errores de tipeo; no repite resultados;
   arma platos combinados («atún con verduras y huevo») y calcula macros que suman 100 %. */
(function (root) {
  const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")

  const tokens = s => norm(s).split(" ").filter(t => t && !VACIAS.has(t));

  const raiz = t => t.length > 4 && t.endsWith("es") && !t.endsWith("ses") ? t.slice(0, -2) : t.length > 3 && t.endsWith("s") ? t.slice(0, -1) : t;

    if (Math.abs(a.length - b.length) > max) return max + 1;

      const cur = [i]; let best = i;

  function calce(q, w) {
